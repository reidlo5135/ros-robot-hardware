robot_lidar_driver:
  ros__parameters:
    lidar_model: "coin_d4_tof"
    port: "/dev/tb3_lidar"
    baudrate: 230400
    frame_id: "base_scan"
    topic_name: "/scan"

    range_min: 0.12
    range_max: 12.0
    angle_min: -3.141592653589793
    angle_max: 3.141592653589793
    scan_angle_offset: 0.0
    scan_direction_reversed: false
    reverse_scan: false
    debug_scan_geometry: false

    fixed_scan_geometry: true
    fixed_scan_samples: 360
    fixed_angle_min: -3.141592653589793
    fixed_angle_max: 3.141592653589793
    fixed_scan_time: 0.1
    fixed_time_increment: 0.0

    publish_rate_hint_hz: 10.0
    read_buffer_size: 4096
    ring_buffer_size: 65536

    use_epoll: true
    reconnect_on_error: true
    reconnect_interval_ms: 1000
    serial_read_timeout_ms: 1000
    startup_delay_ms: 1000

    set_dtr: false
    set_rts: false
    dtr_active: true
    rts_active: true

    log_read_rate: true
    log_raw_packet: false
    log_packet_error: true
    mock_mode: false
