robot_lidar_driver:
  ros__parameters:
    use_sim_time: false
    lidar_model: "coin_d4_tof"
    port: "/dev/tb3_lidar"
    baudrate: 230400
    frame_id: "base_scan"
    topic_name: "/scan"

    range_min: 0.12
    range_max: 12.0
    angle_min: 0.0
    angle_max: 6.283185307179586
    scan_geometry_profile: "tb3_coin_d4"
    scan_angle_offset: 0.0
    scan_direction_reversed: false
    reverse_scan: false
    debug_scan_geometry: false

    fixed_scan_geometry: true
    fixed_scan_samples: 400
    fixed_angle_min: 0.0
    fixed_angle_max: 6.283185307179586
    fixed_scan_time: 0.1
    fixed_time_increment: 0.0
    mirror_scan_angles: true

    publish_rate_hint_hz: 10.0
    read_buffer_size: 4096
    ring_buffer_size: 65536

    use_epoll: true
    reconnect_on_error: true
    reconnect_interval_ms: 1000
    serial_read_timeout_ms: 1000
    startup_delay_ms: 1000

    set_dtr: false
    set_rts: false
    dtr_active: true
    rts_active: true

    log_read_rate: true
    log_raw_packet: false
    log_packet_error: true
    mock_mode: false

    lidar:
      geometry_validation_mode: "manual"

    logging:
      structured_enabled: true
      sensor_state_throttle_sec: 1.0
      scan_geometry_throttle_sec: 1.0
      serial_state_throttle_sec: 2.0
      packet_error_throttle_sec: 1.0
      publish_summary_enabled: true
      frame_diagnostics_enabled: true

robot_base_driver:
  ros__parameters:
    use_sim_time: false
    port: "/dev/ttyACM0"
    baudrate: 1000000
    opencr_id: 200
    protocol_version: 2.0

    cmd_vel_topic: "/cmd_vel"
    cmd_vel_stamped_topic: "/cmd_vel_stamped"
    odom_topic: "/odom"
    imu_topic: "/imu"
    joint_states_topic: "/joint_states"

    odom_frame_id: "odom"
    base_frame_id: "base_footprint"
    imu_frame_id: "imu_link"
    scan_frame_id: "base_scan"

    wheel_left_joint_name: "wheel_left_joint"
    wheel_right_joint_name: "wheel_right_joint"
    wheel_separation: 0.160
    wheel_radius: 0.033
    left_encoder_sign: 1
    right_encoder_sign: 1
    swap_wheel_encoders: false

    odom:
      linear_scale: 1.0
      angular_scale: 1.0
      yaw_source: "wheel_odom"
      imu_yaw_offset_rad: 0.0
      enable_imu_yaw_offset_compensation: false

    tb3_compatibility:
      odom_zero_covariance: true

    odom_pose_covariance_diagonal: [0.01, 0.01, 1000000.0, 1000000.0, 1000000.0, 0.05]
    odom_twist_covariance_diagonal: [0.01, 0.01, 1000000.0, 1000000.0, 1000000.0, 0.05]
    imu_orientation_covariance: [0.0025, 0.0, 0.0, 0.0, 0.0025, 0.0, 0.0, 0.0, 0.01]
    imu_angular_velocity_covariance: [0.02, 0.0, 0.0, 0.0, 0.02, 0.0, 0.0, 0.0, 0.04]
    imu_linear_acceleration_covariance: [0.04, 0.0, 0.0, 0.0, 0.04, 0.0, 0.0, 0.0, 0.04]
    command_mode: "body_twist"

    motors:
      profile_acceleration_constant: 214.577
      profile_acceleration: 0.0

    publish_tf: true
    use_imu_for_yaw: false
    publish_imu: true
    publish_joint_states: true

    battery:
      publish_battery_state: true
      frame_id: "base_link"
      read_enabled: true
      protocol: "tb3_opencr"
      register_address: 42
      register_length: 4
      raw_type: "int32"
      raw_scale: 1.0
      raw_offset: 0.0
      voltage_scale: 0.01
      voltage_offset: 0.0
      publish_percentage: false
      min_voltage: 0.0
      max_voltage: 0.0
      warn_low_voltage: false
      low_voltage: 11.0
      log_battery_state: false
      mapping_state: "tb3_opencr_reference"

    heartbeat_enabled: true
    heartbeat_interval_ms: 100
    poll_interval_ms: 50
    startup_delay_ms: 1000
    response_timeout_ms: 500
    transaction_gap_us: 10000

    reconnect_on_error: true
    reconnect_interval_ms: 1000

    debug_motor_command: true
    debug_odom: false
    debug_odom_interval_ms: 1000
    debug_tf: false
    debug_poll_timing: false
    target_odom_rate_hz: 20.0
    enable_stamped_cmd_vel: false
    motor_torque_enable_on_startup: true
    motor_torque_enable_requires_ack: true
    imu_recalibration_on_startup: false
    imu_recalibration_requires_ack: false
    profile_acceleration_requires_ack: false
    profile_acceleration_on_startup: false
    heartbeat_requires_ack: false
    startup_require_initial_state_read: true
    startup_initial_state_read_retries: 5
    startup_initial_state_read_retry_interval_ms: 200
    poll_mode: "full"
    max_consecutive_poll_failures: 5
    poll_device_status: true
    require_device_status: false
    require_imu: false
    reconnect_on_poll_failure: false
    reopen_serial_on_poll_failure: false
    probe_registers_on_startup: true

    log_serial_packets: false
    log_read_rate: true

    polling:
      fast_state_rate_hz: 20.0
      slow_state_rate_hz: 1.0
      diagnostics_rate_hz: 1.0

    diagnostics:
      angular_sign_min_abs_radps: 0.05
      odom_imu_yaw_delta_warn_rad: 0.35
      odom_cmd_ratio_warn_min: 0.5
      odom_cmd_ratio_warn_max: 1.5
      enable_yaw_offset_monitor: true
      yaw_offset_warn_rad: 0.35
      yaw_offset_window_sec: 3.0

    logging:
      structured_enabled: true
      base_state_throttle_sec: 1.0
      cmd_vel_throttle_sec: 1.0
      odom_throttle_sec: 1.0
      tf_throttle_sec: 1.0
      imu_throttle_sec: 1.0
      joint_state_throttle_sec: 1.0
      serial_state_throttle_sec: 2.0
      opencr_state_throttle_sec: 1.0
      poll_timing_throttle_sec: 2.0
      rotation_diagnostics_throttle_sec: 1.0
      frame_diagnostics_enabled: true
      topic_diagnostics_enabled: true
