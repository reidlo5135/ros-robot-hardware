robot_base_driver:
  ros__parameters:
    port: "/dev/ttyACM0"
    baudrate: 1000000
    opencr_id: 200
    protocol_version: 2.0

    cmd_vel_topic: "/cmd_vel"
    cmd_vel_stamped_topic: "/cmd_vel_stamped"
    odom_topic: "/odom"
    imu_topic: "/imu"
    joint_states_topic: "/joint_states"

    odom_frame_id: "odom"
    base_frame_id: "base_footprint"
    imu_frame_id: "imu_link"

    wheel_left_joint_name: "wheel_left_joint"
    wheel_right_joint_name: "wheel_right_joint"
    wheel_separation: 0.160
    wheel_radius: 0.033

    motors:
      profile_acceleration_constant: 214.577
      profile_acceleration: 0.0

    publish_tf: true
    use_imu_for_yaw: false
    publish_imu: true
    publish_joint_states: true

    heartbeat_enabled: false
    heartbeat_interval_ms: 100
    poll_interval_ms: 300
    startup_delay_ms: 1000
    response_timeout_ms: 500
    transaction_gap_us: 10000

    reconnect_on_error: true
    reconnect_interval_ms: 1000

    enable_stamped_cmd_vel: false
    motor_torque_enable_on_startup: true
    motor_torque_enable_requires_ack: true
    imu_recalibration_on_startup: false
    imu_recalibration_requires_ack: false
    profile_acceleration_requires_ack: false
    profile_acceleration_on_startup: false
    heartbeat_requires_ack: false
    startup_require_initial_state_read: true
    startup_initial_state_read_retries: 5
    startup_initial_state_read_retry_interval_ms: 200
    poll_mode: "full"
    max_consecutive_poll_failures: 5
    poll_device_status: true
    require_device_status: false
    require_imu: false
    reconnect_on_poll_failure: false
    reopen_serial_on_poll_failure: false
    probe_registers_on_startup: true

    log_serial_packets: false
    log_read_rate: true
